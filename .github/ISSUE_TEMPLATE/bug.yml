name: Bug report
description: Report a reproducible CPM22 build or runtime defect
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the shortest reliable sequence of commands/CP/M input.
      placeholder: |
        cmake --preset debug
        cmake --build --preset debug
        ./build/Desktop_Debug/cpm-2.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler, CMake, zmac, Z80 revision, terminal/console client.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant build output, backtraces, or console transcript.
      render: text
